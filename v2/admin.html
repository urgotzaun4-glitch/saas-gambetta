<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion des Questions</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #224761;
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            display: flex;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }

        .templates-panel {
            flex: 0 0 300px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .main-panel {
            flex: 1;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .templates-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .template-item {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .template-item:hover {
            border-color: #224761;
            background: #f9f9f9;
        }

        .template-item.active {
            border-color: #224761;
            background: #224761;
            color: white;
        }

        .template-item strong {
            display: block;
            margin-bottom: 4px;
        }

        .template-item small {
            opacity: 0.7;
            font-size: 12px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #224761;
            margin-bottom: 16px;
            border-bottom: 2px solid #E8B130;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #224761;
            box-shadow: 0 0 0 3px rgba(34, 71, 97, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #224761;
            color: white;
        }

        .btn-primary:hover {
            background: #1a3648;
            box-shadow: 0 4px 12px rgba(34, 71, 97, 0.3);
        }

        .btn-secondary {
            background: #E8B130;
            color: white;
        }

        .btn-secondary:hover {
            background: #d1a028;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            background: #fafafa;
        }

        .item-card.step-card {
            margin-left: 16px;
            border-left: 3px solid #E8B130;
        }

        .item-card.choice-card {
            margin-left: 32px;
            border-left: 3px solid #999;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .item-title {
            font-weight: 600;
            color: #224761;
        }

        .item-subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state strong {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }

            .templates-panel {
                flex: none;
                max-height: none;
                max-width: 100%;
            }

            .main-panel {
                max-height: none;
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #224761;
            margin-bottom: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Design tokens
        const T = {
            colors: {
                blue: '#224761',
                amber: '#E8B130',
                gray: '#999',
                gray5: '#f5f5f5',
                border: '#ddd',
                text: '#333',
            }
        };

        function App() {
            const [templates, setTemplates] = React.useState([]);
            const [selectedTemplate, setSelectedTemplate] = React.useState(null);
            const [steps, setSteps] = React.useState([]);
            const [selectedStep, setSelectedStep] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [message, setMessage] = React.useState(null);
            const [showNewTemplateForm, setShowNewTemplateForm] = React.useState(false);
            const [showNewStepForm, setShowNewStepForm] = React.useState(false);
            const [showNewChoiceForm, setShowNewChoiceForm] = React.useState(false);
            const [showEditTemplateForm, setShowEditTemplateForm] = React.useState(false);
            const [editingItem, setEditingItem] = React.useState(null);

            // Form states
            const [templateForm, setTemplateForm] = React.useState({ name: '', description: '', is_active: false });
            const [stepForm, setStepForm] = React.useState({ 
                step_key: '', question_text: '', question_subtitle: '', 
                step_order: 0, step_type: 'choice', is_required: true, can_upload_files: false 
            });
            const [choiceForm, setChoiceForm] = React.useState({
                choice_id: '', choice_label: '', choice_sublabel: '', choice_order: 0,
                priority_level: 'normal', indicates_urgency: false
            });

            // Load templates on mount
            React.useEffect(() => {
                loadTemplates();
            }, []);

            // Load steps when template changes
            React.useEffect(() => {
                if (selectedTemplate) {
                    loadSteps(selectedTemplate.id);
                    setSelectedStep(null);
                } else {
                    setSteps([]);
                }
            }, [selectedTemplate]);

            const showMsg = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3000);
            };

            const loadTemplates = async () => {
                setLoading(true);
                try {
                    const res = await fetch('https://api2.oriyaka.com/admin/templates');
                    const data = await res.json();
                    setTemplates(data);
                    if (data.length > 0 && !selectedTemplate) {
                        setSelectedTemplate(data[0]);
                    }
                } catch (err) {
                    showMsg('Erreur lors du chargement des templates', 'error');
                }
                setLoading(false);
            };

            const loadSteps = async (templateId) => {
                try {
                    const res = await fetch(`https://api2.oriyaka.com/admin/templates/${templateId}/steps`);
                    const data = await res.json();
                    setSteps(data);
                } catch (err) {
                    showMsg('Erreur lors du chargement des étapes', 'error');
                }
            };

            const createTemplate = async () => {
                if (!templateForm.name.trim()) {
                    showMsg('Le nom du template est requis', 'error');
                    return;
                }
                try {
                    const params = new URLSearchParams({
                        name: templateForm.name,
                        description: templateForm.description,
                        is_active: true  // Make new templates active by default
                    });
                    const res = await fetch(`https://api2.oriyaka.com/admin/templates?${params}`, {
                        method: 'POST'
                    });
                    if (res.ok) {
                        await loadTemplates();
                        setTemplateForm({ name: '', description: '', is_active: false });
                        setShowNewTemplateForm(false);
                        showMsg('Template créé avec succès');
                    } else {
                        const error = await res.json();
                        showMsg(`Erreur: ${error.detail || res.statusText}`, 'error');
                    }
                } catch (err) {
                    showMsg(`Erreur lors de la création: ${err.message}`, 'error');
                }
            };

            const updateTemplate = async () => {
                if (!editingItem || editingItem.type !== 'template') return;
                try {
                    const params = new URLSearchParams({
                        name: templateForm.name,
                        description: templateForm.description,
                        is_active: templateForm.is_active
                    });
                    const res = await fetch(`https://api2.oriyaka.com/admin/templates/${editingItem.id}?${params}`, {
                        method: 'PUT'
                    });
                    if (res.ok) {
                        await loadTemplates();
                        setEditingItem(null);
                        setShowEditTemplateForm(false);
                        showMsg('Template mis à jour');
                    }
                } catch (err) {
                    showMsg('Erreur lors de la mise à jour', 'error');
                }
            };

            const deleteTemplate = async (id) => {
                if (!confirm('Êtes-vous sûr ? Cette action supprimera aussi toutes les étapes et réponses.')) return;
                try {
                    const res = await fetch(`https://api2.oriyaka.com/admin/templates/${id}`, {
                        method: 'DELETE'
                    });
                    if (res.ok) {
                        await loadTemplates();
                        showMsg('Template supprimé');
                    }
                } catch (err) {
                    showMsg('Erreur lors de la suppression', 'error');
                }
            };

            const createStep = async () => {
                if (!selectedTemplate) {
                    showMsg('Sélectionnez d\'abord un template', 'error');
                    return;
                }
                if (!stepForm.step_key.trim() || !stepForm.question_text.trim()) {
                    showMsg('La clé et la question sont requises', 'error');
                    return;
                }
                try {
                    const params = new URLSearchParams({
                        step_key: stepForm.step_key,
                        question_text: stepForm.question_text,
                        question_subtitle: stepForm.question_subtitle,
                        step_order: stepForm.step_order,
                        step_type: stepForm.step_type,
                        is_required: stepForm.is_required,
                        can_upload_files: stepForm.can_upload_files
                    });
                    const res = await fetch(`https://api2.oriyaka.com/admin/templates/${selectedTemplate.id}/steps?${params}`, {
                        method: 'POST'
                    });
                    if (res.ok) {
                        await loadSteps(selectedTemplate.id);
                        setStepForm({ 
                            step_key: '', question_text: '', question_subtitle: '', 
                            step_order: 0, step_type: 'choice', is_required: true, can_upload_files: false 
                        });
                        setShowNewStepForm(false);
                        showMsg('Étape créée');
                    }
                } catch (err) {
                    showMsg('Erreur lors de la création', 'error');
                }
            };

            const deleteStep = async (stepId) => {
                if (!confirm('Êtes-vous sûr ? Cette action supprimera aussi toutes les réponses.')) return;
                if (!selectedTemplate) return;
                try {
                    const res = await fetch(`https://api2.oriyaka.com/admin/templates/${selectedTemplate.id}/steps/${stepId}`, {
                        method: 'DELETE'
                    });
                    if (res.ok) {
                        await loadSteps(selectedTemplate.id);
                        setSelectedStep(null);
                        showMsg('Étape supprimée');
                    }
                } catch (err) {
                    showMsg('Erreur lors de la suppression', 'error');
                }
            };

            const createChoice = async () => {
                if (!selectedTemplate || !selectedStep) {
                    showMsg('Sélectionnez une étape d\'abord', 'error');
                    return;
                }
                if (!choiceForm.choice_id.trim() || !choiceForm.choice_label.trim()) {
                    showMsg('L\'ID et le label sont requis', 'error');
                    return;
                }
                try {
                    const params = new URLSearchParams({
                        choice_id: choiceForm.choice_id,
                        choice_label: choiceForm.choice_label,
                        choice_sublabel: choiceForm.choice_sublabel,
                        choice_order: choiceForm.choice_order,
                        priority_level: choiceForm.priority_level,
                        indicates_urgency: choiceForm.indicates_urgency
                    });
                    const res = await fetch(
                        `https://api2.oriyaka.com/admin/templates/${selectedTemplate.id}/steps/${selectedStep.id}/choices?${params}`,
                        {
                            method: 'POST'
                        }
                    );
                    if (res.ok) {
                        await loadSteps(selectedTemplate.id);
                        setChoiceForm({
                            choice_id: '', choice_label: '', choice_sublabel: '', choice_order: 0,
                            priority_level: 'normal', indicates_urgency: false
                        });
                        setShowNewChoiceForm(false);
                        showMsg('Réponse créée');
                    }
                } catch (err) {
                    showMsg('Erreur lors de la création', 'error');
                }
            };

            const deleteChoice = async (choiceId) => {
                if (!confirm('Êtes-vous sûr ?')) return;
                if (!selectedTemplate || !selectedStep) return;
                try {
                    const res = await fetch(
                        `https://api2.oriyaka.com/admin/templates/${selectedTemplate.id}/steps/${selectedStep.id}/choices/${choiceId}`,
                        { method: 'DELETE' }
                    );
                    if (res.ok) {
                        await loadSteps(selectedTemplate.id);
                        showMsg('Réponse supprimée');
                    }
                } catch (err) {
                    showMsg('Erreur lors de la suppression', 'error');
                }
            };

            return (
                <div className="app">
                    <div className="header">
                        <h1>Administration - Gestion des Questions</h1>
                    </div>

                    <div className="container">
                        {/* Templates Panel */}
                        <div className="panel templates-panel">
                            <div className="section">
                                <div className="section-title">Templates</div>
                                {message && (
                                    <div className={`message ${message.type}`}>
                                        {message.text}
                                    </div>
                                )}
                                <div className="button-group">
                                    <button className="btn btn-primary" onClick={() => setShowNewTemplateForm(true)}>
                                        + Nouveau Template
                                    </button>
                                </div>
                            </div>

                            {loading ? (
                                <div className="loading">Chargement...</div>
                            ) : templates.length === 0 ? (
                                <div className="empty-state">
                                    <strong>Aucun template</strong>
                                    Créez le premier template pour commencer
                                </div>
                            ) : (
                                <div className="templates-list">
                                    {templates.map(t => (
                                        <div 
                                            key={t.id} 
                                            className={`template-item ${selectedTemplate?.id === t.id ? 'active' : ''}`}
                                            onClick={() => setSelectedTemplate(t)}
                                        >
                                            <strong>{t.name}</strong>
                                            <small>{t.description}</small>
                                            <div className="button-group" style={{ marginTop: '8px' }} onClick={e => e.stopPropagation()}>
                                                <button 
                                                    className="btn btn-secondary btn-small"
                                                    onClick={() => {
                                                        setEditingItem({ type: 'template', id: t.id });
                                                        setTemplateForm({
                                                            name: t.name,
                                                            description: t.description,
                                                            is_active: t.is_active
                                                        });
                                                        setShowEditTemplateForm(true);
                                                    }}
                                                >
                                                    Éditer
                                                </button>
                                                <button 
                                                    className="btn btn-danger btn-small"
                                                    onClick={() => deleteTemplate(t.id)}
                                                >
                                                    Supprimer
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Main Panel */}
                        <div className="panel main-panel">
                            {!selectedTemplate ? (
                                <div className="empty-state">
                                    <strong>Sélectionnez un template</strong>
                                    Choisissez un template à gauche pour commencer
                                </div>
                            ) : (
                                <>
                                    <div className="section">
                                        <div className="section-title">Étapes de "{selectedTemplate.name}"</div>
                                        <button className="btn btn-primary" onClick={() => setShowNewStepForm(true)}>
                                            + Nouvelle Étape
                                        </button>
                                    </div>

                                    {steps.length === 0 ? (
                                        <div className="empty-state">
                                            <strong>Aucune étape</strong>
                                            Créez la première étape pour ce template
                                        </div>
                                    ) : (
                                        <div className="item-list">
                                            {steps.map(step => (
                                                <div key={step.id}>
                                                    <div className="item-card step-card">
                                                        <div className="item-header">
                                                            <div>
                                                                <div className="item-title">{step.question_text}</div>
                                                                <div className="item-subtitle">
                                                                    Clé: {step.step_key} • Type: {step.step_type}
                                                                </div>
                                                            </div>
                                                            <div className="item-actions">
                                                                <button 
                                                                    className="btn btn-secondary btn-small"
                                                                    onClick={() => setSelectedStep(step)}
                                                                >
                                                                    Voir
                                                                </button>
                                                                <button 
                                                                    className="btn btn-danger btn-small"
                                                                    onClick={() => deleteStep(step.id)}
                                                                >
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {selectedStep?.id === step.id && (
                                                        <div style={{ marginTop: '16px', marginLeft: '16px' }}>
                                                            <div className="section-title">Réponses possibles</div>
                                                            <button 
                                                                className="btn btn-primary"
                                                                onClick={() => setShowNewChoiceForm(true)}
                                                            >
                                                                + Nouvelle Réponse
                                                            </button>

                                                            {!step.choices || step.choices.length === 0 ? (
                                                                <div className="empty-state" style={{ marginTop: '16px' }}>
                                                                    <strong>Aucune réponse</strong>
                                                                    Créez la première réponse pour cette étape
                                                                </div>
                                                            ) : (
                                                                <div className="item-list" style={{ marginTop: '16px' }}>
                                                                    {step.choices.map(choice => (
                                                                        <div key={choice.id} className="item-card choice-card">
                                                                            <div className="item-header">
                                                                                <div>
                                                                                    <div className="item-title">{choice.choice_label}</div>
                                                                                    <div className="item-subtitle">
                                                                                        ID: {choice.choice_id}
                                                                                        {choice.indicates_urgency && ' • ⚠️ Urgent'}
                                                                                    </div>
                                                                                </div>
                                                                                <button 
                                                                                    className="btn btn-danger btn-small"
                                                                                    onClick={() => deleteChoice(choice.choice_id)}
                                                                                >
                                                                                    ✕
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>

                    {/* Modals */}
                    {showNewTemplateForm && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-title">Créer un nouveau template</div>
                                <div className="form-group">
                                    <label>Nom du template</label>
                                    <input 
                                        type="text"
                                        value={templateForm.name}
                                        onChange={e => setTemplateForm({...templateForm, name: e.target.value})}
                                        placeholder="ex: Diagnostic d'Enseigne"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Description</label>
                                    <textarea 
                                        value={templateForm.description}
                                        onChange={e => setTemplateForm({...templateForm, description: e.target.value})}
                                        placeholder="Description du template"
                                    />
                                </div>
                                <div className="modal-buttons">
                                    <button className="btn" style={{background: '#ccc'}} onClick={() => setShowNewTemplateForm(false)}>
                                        Annuler
                                    </button>
                                    <button className="btn btn-primary" onClick={createTemplate}>
                                        Créer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditTemplateForm && editingItem && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-title">Éditer le template</div>
                                <div className="form-group">
                                    <label>Nom du template</label>
                                    <input 
                                        type="text"
                                        value={templateForm.name}
                                        onChange={e => setTemplateForm({...templateForm, name: e.target.value})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Description</label>
                                    <textarea 
                                        value={templateForm.description}
                                        onChange={e => setTemplateForm({...templateForm, description: e.target.value})}
                                    />
                                </div>
                                <div className="form-group">
                                    <div className="checkbox-group">
                                        <input 
                                            type="checkbox"
                                            id="is_active"
                                            checked={templateForm.is_active}
                                            onChange={e => setTemplateForm({...templateForm, is_active: e.target.checked})}
                                        />
                                        <label htmlFor="is_active" style={{margin: 0}}>Actif</label>
                                    </div>
                                </div>
                                <div className="modal-buttons">
                                    <button className="btn" style={{background: '#ccc'}} onClick={() => {
                                        setShowEditTemplateForm(false);
                                        setEditingItem(null);
                                    }}>
                                        Annuler
                                    </button>
                                    <button className="btn btn-primary" onClick={updateTemplate}>
                                        Mettre à jour
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showNewStepForm && selectedTemplate && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-title">Créer une nouvelle étape</div>
                                <div className="form-group">
                                    <label>Clé de l'étape (identifiant unique)</label>
                                    <input 
                                        type="text"
                                        value={stepForm.step_key}
                                        onChange={e => setStepForm({...stepForm, step_key: e.target.value})}
                                        placeholder="ex: lumineux_symptome"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Question</label>
                                    <input 
                                        type="text"
                                        value={stepForm.question_text}
                                        onChange={e => setStepForm({...stepForm, question_text: e.target.value})}
                                        placeholder="ex: Quel est le problème principal ?"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Sous-titre (optionnel)</label>
                                    <input 
                                        type="text"
                                        value={stepForm.question_subtitle}
                                        onChange={e => setStepForm({...stepForm, question_subtitle: e.target.value})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Ordre</label>
                                    <input 
                                        type="number"
                                        value={stepForm.step_order}
                                        onChange={e => setStepForm({...stepForm, step_order: parseInt(e.target.value)})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Type</label>
                                    <select 
                                        value={stepForm.step_type}
                                        onChange={e => setStepForm({...stepForm, step_type: e.target.value})}
                                    >
                                        <option value="choice">Choix multiple</option>
                                        <option value="text">Texte libre</option>
                                        <option value="upload">Fichier</option>
                                        <option value="info">Information</option>
                                    </select>
                                </div>
                                <div className="form-group">
                                    <div className="checkbox-group">
                                        <input 
                                            type="checkbox"
                                            id="can_upload"
                                            checked={stepForm.can_upload_files}
                                            onChange={e => setStepForm({...stepForm, can_upload_files: e.target.checked})}
                                        />
                                        <label htmlFor="can_upload" style={{margin: 0}}>Permet les uploads</label>
                                    </div>
                                </div>
                                <div className="modal-buttons">
                                    <button className="btn" style={{background: '#ccc'}} onClick={() => setShowNewStepForm(false)}>
                                        Annuler
                                    </button>
                                    <button className="btn btn-primary" onClick={createStep}>
                                        Créer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showNewChoiceForm && selectedStep && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-title">Créer une nouvelle réponse</div>
                                <div className="form-group">
                                    <label>ID de la réponse</label>
                                    <input 
                                        type="text"
                                        value={choiceForm.choice_id}
                                        onChange={e => setChoiceForm({...choiceForm, choice_id: e.target.value})}
                                        placeholder="ex: symptome_scintillement"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Label (affiché à l'utilisateur)</label>
                                    <input 
                                        type="text"
                                        value={choiceForm.choice_label}
                                        onChange={e => setChoiceForm({...choiceForm, choice_label: e.target.value})}
                                        placeholder="ex: Scintillement"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Sous-label (optionnel)</label>
                                    <input 
                                        type="text"
                                        value={choiceForm.choice_sublabel}
                                        onChange={e => setChoiceForm({...choiceForm, choice_sublabel: e.target.value})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Ordre</label>
                                    <input 
                                        type="number"
                                        value={choiceForm.choice_order}
                                        onChange={e => setChoiceForm({...choiceForm, choice_order: parseInt(e.target.value)})}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Niveau de priorité</label>
                                    <select 
                                        value={choiceForm.priority_level}
                                        onChange={e => setChoiceForm({...choiceForm, priority_level: e.target.value})}
                                    >
                                        <option value="low">Basse</option>
                                        <option value="normal">Normal</option>
                                        <option value="high">Haute</option>
                                        <option value="urgent">Urgent</option>
                                    </select>
                                </div>
                                <div className="form-group">
                                    <div className="checkbox-group">
                                        <input 
                                            type="checkbox"
                                            id="indicates_urgency"
                                            checked={choiceForm.indicates_urgency}
                                            onChange={e => setChoiceForm({...choiceForm, indicates_urgency: e.target.checked})}
                                        />
                                        <label htmlFor="indicates_urgency" style={{margin: 0}}>Urgent</label>
                                    </div>
                                </div>
                                <div className="modal-buttons">
                                    <button className="btn" style={{background: '#ccc'}} onClick={() => setShowNewChoiceForm(false)}>
                                        Annuler
                                    </button>
                                    <button className="btn btn-primary" onClick={createChoice}>
                                        Créer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
